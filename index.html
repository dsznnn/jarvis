<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>JARVIS</title>
<style>
:root{--bg:#0b0b0c;--p:#131315;--b:#26262a;--t:#e8e8ea;--m:#8a8a92;--r:#e0645f;--g:#6dbb88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f6f6f4;--p:#fff;--b:#dcdcd8;--t:#18181a;--m:#6b6b72}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;display:flex;min-height:100%}
.side{width:200px;border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;transition:margin .2s;flex:none;background:var(--bg);z-index:5}
.side.c{margin-left:-200px}.side h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:4px 10px 14px}
.side a{display:block;padding:7px 10px;border-radius:5px;color:var(--m);cursor:pointer}.side a:hover,.side a.on{background:var(--p);color:var(--t)}
.main{flex:1;min-width:0;padding:0 20px 60px;max-width:1200px}
.top{display:flex;gap:8px;align-items:center;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:4}
.top input{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:5px;padding:6px 10px}
button{cursor:pointer;transition:border-color .15s}button:hover{border-color:var(--m)}.b{background:var(--a,var(--t));color:var(--bg);border-color:var(--a,var(--t))}
h2{font-weight:600;font-size:20px;margin:0}h4{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--m);font-weight:500}
.hd{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--b);border-radius:var(--rad,6px);padding:var(--pad,14px);background:var(--p);animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}.g{flex:1;min-width:0;display:flex;flex-direction:column}
.m{color:var(--m);font-size:12px}.dn b{text-decoration:line-through;color:var(--m)}ul{margin:0;padding-left:18px}
.pr{font-style:normal;font-size:11px;border:1px solid var(--b);border-radius:4px;padding:1px 6px;color:var(--m)}.pr.Critical{color:var(--r);border-color:var(--r)}.pr.High{color:var(--t)}
.bar{height:5px;background:var(--b);border-radius:3px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--a,var(--t))}
.big{font-size:28px;font-weight:600}.red{color:var(--r)}.grn{color:var(--g)}
.dy{width:30px;padding:4px 0;text-align:center}.dy.on{background:var(--a,var(--t));color:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{border:1px solid var(--b);min-height:54px;padding:4px;border-radius:4px;cursor:pointer;font-size:12px}.cal .sel{border-color:var(--t)}.cal .td{background:var(--p)}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:8px;width:min(440px,92vw)}dialog::backdrop{background:#0009}
label{display:block;margin:8px 0;font-size:12px;color:var(--m)}label *{display:block;width:100%;margin-top:3px}.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.r button{width:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 14px;border-radius:5px;display:none;z-index:9}
.tag{font-size:11px;color:var(--m);border:1px dashed var(--b);padding:1px 6px;border-radius:4px}
@media(max-width:720px){.grid>.card{grid-column:auto!important}.side{position:fixed;margin-left:-200px}.side.o{margin-left:0}.main{padding:0 12px 60px}}
</style></head><body>
<nav class="side" id="side"><h1 id=bn>JARVIS</h1><div id="nav"></div></nav>
<div class="main"><div class="top"><button data-a="menu">☰</button><input id="q" placeholder="Search this page…" aria-label="Search"><button class="b" data-a="add:notes">+ Note</button></div><div id="v"></div></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const K='lifeos1',$=s=>document.querySelector(s),D=()=>new Date().toLocaleDateString('sv'),uid=()=>Math.random().toString(36).slice(2,9);
const add=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=o=>({id:uid(),s:1,...o}),sum=a=>a.reduce((x,y)=>x+(+y||0),0);
let S,view='dashboard',q='',tf={s:'',pr:'',p:''},cm=D().slice(0,7),sel=D(),cust=false;
function seed(){const t=D();return{set:{cur:'ZAR',theme:'dark',hide:[],order:null},focus:{d:'',ids:[]},
tasks:[mk({title:'Submit assignment draft',priority:'High',status:'In Progress',due:t,project:'Studies'}),mk({title:'Pay car insurance',priority:'Critical',status:'To Do',due:add(t,-2)}),mk({title:'Plan weekly meals',priority:'Medium',status:'To Do',due:add(t,3)})],
events:[mk({title:'Study block',date:t,start:'09:00',end:'11:00',type:'Study'}),mk({title:'Gym',date:t,start:'17:30',end:'18:30',type:'Exercise'})],
habits:[mk({name:'Study 1 hour',target:5,log:{}}),mk({name:'Exercise',target:3,log:{}}),mk({name:'Read 20 min',target:7,log:{}})],
goals:[mk({title:'Save emergency fund',category:'Finances',target:add(t,120),progress:35,status:'Active'})],
tx:[mk({desc:'Salary',type:'Income',amount:15000,category:'Salary',date:t}),mk({desc:'Rent',type:'Expense',amount:4500,category:'Housing',date:t}),mk({desc:'Groceries',type:'Expense',amount:1200,category:'Food',date:t})],
notes:[],study:[],projects:[],health:[],reviews:{}}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S){S=seed();['tasks','events','habits','goals','tx'].forEach(k=>S[k]=[])}
function save(){S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage unavailable: changes will not persist')}queuePush()}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:S.set.cur}).format(n||0);
const PR={Critical:0,High:1,Medium:2,Low:3};
const M={
tasks:{n:'Task',f:[['title','Title','text'],['priority','Priority','sel',['Low','Medium','High','Critical']],['status','Status','sel',['To Do','In Progress','Waiting','Completed']],['due','Due date','date'],['project','Project','text'],['repeat','Repeat','sel',['None','Daily','Weekly','Monthly']],['notes','Notes / checklist','area']],def:{priority:'Medium',status:'To Do',repeat:'None'}},
events:{n:'Event',f:[['title','Title','text'],['date','Date','date'],['start','Start','time'],['end','End','time'],['type','Type','sel',['Event','Appointment','Deadline','Reminder','Work','Study','Exercise','Personal','Exam']]]},
goals:{n:'Goal',f:[['title','Title','text'],['category','Category','sel',['Personal development','Education','Business','Finances','Fitness','Relationships','Lifestyle']],['target','Target date','date'],['progress','Progress %','num'],['status','Status','sel',['Active','Paused','Completed','Abandoned']],['notes','Milestones / reflections','area']]},
tx:{n:'Transaction',f:[['desc','Description','text'],['type','Type','sel',['Expense','Income']],['amount','Amount','num'],['category','Category','text'],['date','Date','date']],sort:(a,b)=>b.date>a.date?1:-1,x:i=>(i.type=='Income'?'+':'-')+money(i.amount)},
notes:{n:'Note',f:[['title','Title','text'],['kind','Kind','sel',['Quick note','Long note','Daily journal','Weekly reflection']],['tag','Tags','text'],['pin','Pinned','sel',['No','Yes']],['archived','Status','sel',['Active','Archived']],['body','Content','area']],sort:(a,b)=>(b.pin=='Yes')-(a.pin=='Yes')},
study:{n:'Study session',f:[['subject','Subject','text'],['date','Date','date'],['minutes','Minutes','num'],['topic','Topic','text'],['level','Understanding','sel',['Understood','Needs work']]],sort:(a,b)=>b.date>a.date?1:-1},
projects:{n:'Project',f:[['title','Name','text'],['status','Status','sel',['Active','On hold','Completed']],['deadline','Deadline','date'],['notes','Meetings, ideas, contacts','area']]},
health:{n:'Health entry',f:[['date','Date','date'],['sleep','Sleep (hours)','num'],['exercise','Exercise (min)','num'],['water','Water (glasses)','num'],['energy','Energy 1-5','num'],['mood','Mood 1-5','num']],sort:(a,b)=>b.date>a.date?1:-1}};
const T={tasks:'Tasks',events:'Events',goals:'Goals',tx:'Transactions',notes:'Notes',study:'Study log',projects:'Projects',health:'Health log'};
const open=()=>S.tasks.filter(t=>t.status!='Completed'),over=()=>open().filter(t=>t.due&&t.due<D());
const focusT=()=>S.focus.d==D()?S.focus.ids.map(i=>S.tasks.find(t=>t.id==i)).filter(Boolean):[];
const evT=(d=D())=>[...S.events.filter(e=>e.date==d),...open().filter(t=>t.due==d).map(t=>({title:t.title,start:'',type:'Task due'}))];
const cnt=(h,n,o=0)=>{let c=0,d=add(D(),-o);for(let i=0;i<n;i++){if(h.log[d])c++;d=add(d,-1)}return c};
const streak=h=>{let d=D(),n=0;if(!h.log[d])d=add(d,-1);while(h.log[d]){n++;d=add(d,-1)}return n};
const score=(n,o=0)=>{let e=0,c=0;S.habits.filter(h=>!h.paused).forEach(h=>{const x=h.target*n/7;e+=x;c+=Math.min(cnt(h,n,o),x)});return e?Math.round(100*c/e):null};
const pct=(a,b)=>b?Math.round(100*a/b):0,bar=(p)=>`<div class=bar><i style="width:${Math.min(100,p)}%"></i></div>`;
const tRow=t=>`<div class="row ${t.status=='Completed'?'dn':''}"><input type=checkbox style="width:auto" ${t.status=='Completed'?'checked':''} data-a="tog:${t.id}"><div class=g><b>${esc(t.title)}</b><span class="m ${t.due&&t.due<D()&&t.status!='Completed'?'red':''}">${t.due||'no date'}${t.project?' · '+esc(t.project):''}</span></div><i class="pr ${t.priority}">${t.priority}</i><button data-a="edit:tasks:${t.id}">Edit</button></div>`;
const none=s=>`<p class=m>${s}</p>`;
const W={
brief:['Daily briefing',()=>{const t=D(),f=focusT(),dl=open().filter(x=>x.due>t&&x.due<=add(t,7)).length,hl=S.habits.filter(h=>!h.paused&&!h.log[t]),ov=over(),dT=open().filter(x=>x.due==t).length,ag=S.goals.filter(g=>g.status=='Active');
const tip=!f.length&&open().length?'Pick your 3 focus tasks first.':ov.length>2?`${ov.length} tasks are overdue. Reschedule or drop the ones that no longer matter.`:dT>4?`${dT} tasks are due today. Move the lowest-priority ones.`:'Load looks manageable. Protect your focus tasks.';
return `<ul><li>Focus: ${f.length?f.map(x=>esc(x.title)).join(', '):'not chosen'}</li><li>${dT} due today, ${dl} due in 7 days</li><li>${evT().length} calendar items today</li><li>Habits left: ${hl.map(h=>esc(h.name)).join(', ')||'none'}</li><li>${ov.length} overdue</li><li>${ag.length} active goals, average ${ag.length?Math.round(sum(ag.map(g=>g.progress))/ag.length):0}%</li></ul><p class=m>Suggestion (rule-based, no AI): ${tip}</p>`}],
focus:['Daily focus',()=>{const f=focusT();return (f.length?f.map(tRow).join(''):none('You have not chosen today\'s three most important tasks.'))+`<button data-a="pick" style="margin-top:8px">Choose top 3</button>`}],
prog:['Today\'s progress',()=>{const t=D(),ts=S.tasks.filter(x=>x.due==t||focusT().includes(x)),d=ts.filter(x=>x.status=='Completed').length,hs=S.habits.filter(h=>!h.paused),hd=hs.filter(h=>h.log[t]).length;
return `Tasks ${d}/${ts.length}${bar(pct(d,ts.length))}Habits ${hd}/${hs.length}${bar(pct(hd,hs.length))}`}],
over:['Overdue',()=>{const o=over();return o.length?o.map(tRow).join(''):none('Nothing overdue.')}],
time:['Today\'s timeline',()=>{const e=evT().sort((a,b)=>(a.start||'99')>(b.start||'99')?1:-1);return e.length?e.map(x=>`<div class=row><span class=m style="width:90px">${x.start||'All day'}</span><b>${esc(x.title)}</b><span class=tag>${x.type}</span></div>`).join(''):none('Nothing scheduled today.')}],
up:['Upcoming (7 days)',()=>{const u=[...S.events.filter(e=>e.date>D()&&e.date<=add(D(),7)).map(e=>[e.date,e.title,e.type]),...open().filter(t=>t.due>D()&&t.due<=add(D(),7)).map(t=>[t.due,t.title,'Deadline'])].sort();return u.length?u.map(x=>`<div class=row><span class=m style="width:90px">${x[0]}</span><b>${esc(x[1])}</b><span class=tag>${x[2]}</span></div>`).join(''):none('No upcoming items.')}],
hab:['Habits today',()=>S.habits.filter(h=>!h.paused).map(h=>`<div class=row><input type=checkbox style="width:auto" ${h.log[D()]?'checked':''} data-a="hab:${h.id}:${D()}"><b class=g>${esc(h.name)}</b><span class=m>${streak(h)}d streak</span></div>`).join('')||none('No habits yet.')],
goal:['Goals',()=>S.goals.filter(g=>g.status=='Active').map(g=>`<div>${esc(g.title)} <span class=m>${g.progress||0}%</span>${bar(g.progress)}</div>`).join('')||none('No active goals.')],
fin:['Finances (manual records)',()=>{const m=D().slice(0,7),i=sum(S.tx.filter(x=>x.type=='Income'&&x.date.startsWith(m)).map(x=>x.amount)),e=sum(S.tx.filter(x=>x.type=='Expense'&&x.date.startsWith(m)).map(x=>x.amount));return `<div class=big>${money(bal())}</div><span class=m>Recorded balance, not a bank balance</span><p>This month: <span class=grn>+${money(i)}</span> / <span class=red>-${money(e)}</span></p>`}],
week:['This week',()=>`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${[0,1,2,3,4,5,6].map(i=>{const d=add(D(),i);return `<div style="border:1px solid var(--b);border-radius:4px;padding:6px 0;cursor:pointer" data-a="day:${d}"><div class=m>${new Date(d+'T12:00').toLocaleDateString('en',{weekday:'short'})}</div><b>${evT(d).length}</b></div>`}).join('')}</div>`],
note:['Quick note',()=>`<input id=qn placeholder="Capture an idea, press Enter" style="width:100%"><div style="margin-top:8px">${S.notes.filter(n=>n.archived!='Archived').slice(-3).reverse().map(n=>`<div class=row><span>${esc(n.title)}</span></div>`).join('')}</div>`]};
const bal=()=>sum(S.tx.map(x=>x.type=='Income'?x.amount:-x.amount));
const V={};
V.dashboard=()=>{const h=new Date().getHours(),ord=(S.set.order||Object.keys(W)).filter(k=>W[k]),hid=S.set.hide;
return `<div class=hd><div><h2>${(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+(U().me?', '+esc(U().me):'')}</h2><span class=m><span id=clk></span></span></div><button data-a="cust">${cust?'Done':'Customise'}</button></div>${S.tasks.concat(S.habits,S.goals).some(x=>x.s)?`<p class=m><span class=tag>Sample data</span> The items marked as sample can be removed. <button data-a="nosample">Remove sample data</button></p>`:''}<div class=grid>${ord.filter(k=>cust||!hid.includes(k)).map(k=>`<div class=card style='grid-column:span ${U().span?.[k]||1}'><h4>${esc(U().wt?.[k]||W[k][0])}${cust?` <span style="float:right"><button data-a="mv:${k}:-1">↑</button><button data-a="mv:${k}:1">↓</button><button data-a="size:${k}">↔</button><button data-a="ren:${k}">Aa</button><button data-a="hide:${k}">${hid.includes(k)?'Show':'Hide'}</button></span>`:''}</h4>${W[k][1]()}</div>`).join('')}</div>`};
V.tasks=()=>{let L=S.tasks.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!tf.s||t.status==tf.s)&&(!tf.pr||t.priority==tf.pr)&&(!tf.p||t.project==tf.p)).sort((a,b)=>(a.status=='Completed')-(b.status=='Completed')||PR[a.priority]-PR[b.priority]||(a.due||'z')>(b.due||'z')?1:-1);
const sl=(k,o,l)=>`<select onchange="tf.${k}=this.value;render()"><option value="">${l}</option>${o.map(x=>`<option ${tf[k]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
return `<div class=hd><h2>Tasks</h2><button class=b data-a="add:tasks">+ Task</button></div><div class=hd>${sl('s',M.tasks.f[2][3],'All statuses')}${sl('pr',M.tasks.f[1][3],'All priorities')}${sl('p',[...new Set(S.tasks.map(t=>t.project).filter(Boolean))],'All projects')}</div><div class=card>${L.map(tRow).join('')||none('No tasks match. Add one or clear filters.')}</div>`};
V.calendar=()=>{const f=new Date(cm+'-01T12:00'),off=(f.getDay()+(U().sun?0:6))%7,n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();let c='';for(let i=0;i<off;i++)c+='<span></span>';
for(let d=1;d<=n;d++){const k=cm+'-'+String(d).padStart(2,'0');c+=`<div class="${k==sel?'sel':''} ${k==D()?'td':''}" data-a="day:${k}">${d}<br><span class=m>${evT(k).length||''}</span></div>`}
return `<div class=hd><h2>${f.toLocaleDateString('en',{month:'long',year:'numeric'})}</h2><span><button data-a="mon:-1">←</button> <button data-a="mon:1">→</button></span></div><div class=cal>${c}</div><div class=card style="margin-top:12px"><div class=hd><h4>${sel}</h4><button class=b data-a="add:events" data-d="${sel}">+ Event</button></div>${S.events.filter(e=>e.date==sel).map(e=>`<div class=row><span class=m style="width:90px">${e.start||''}–${e.end||''}</span><b class=g>${esc(e.title)}</b><span class=tag>${e.type}</span><button data-a="edit:events:${e.id}">Edit</button></div>`).join('')}${open().filter(t=>t.due==sel).map(tRow).join('')||''}</div><p class=m>Internal calendar only. No external calendar sync or push notifications are connected.</p>`};
V.habits=()=>{const days=[6,5,4,3,2,1,0].map(i=>add(D(),-i)),s7=score(7),s30=score(30);
return `<div class=hd><h2>Habits</h2><button class=b data-a="habit">+ Habit</button></div><div class=card><h4>Consistency score</h4><span class=big>${s7??'–'}${s7!=null?'%':''}</span> <span class=m>last 7 days · 30 days: ${s30??'–'}%</span><p class=m>How it works: each active habit has a weekly target. Check-ins up to that target count as completed. Extra check-ins add nothing, and days off within your target cost nothing. Score = completed ÷ expected check-ins across active habits. Paused habits are excluded. Tasks are tracked separately.</p></div><div class=card style="margin-top:12px">${S.habits.map(h=>`<div class=row style="flex-wrap:wrap;${h.paused?'opacity:.5':''}"><div class=g><b>${esc(h.name)}</b><span class=m>${streak(h)}d streak · ${cnt(h,7)}/${h.target} this week · 30d: ${pct(cnt(h,30),h.target*30/7)}%</span></div>${days.map(d=>`<button class="dy ${h.log[d]?'on':''}" data-a="hab:${h.id}:${d}">${new Date(d+'T12:00').toLocaleDateString('en',{weekday:'narrow'})}</button>`).join('')}<button data-a="pause:${h.id}">${h.paused?'Resume':'Pause'}</button><button data-a="habit:${h.id}">Edit</button></div>`).join('')||none('No habits yet.')}</div>`};
V.goals=()=>gen('goals');V.notes=()=>gen('notes');V.projects=()=>gen('projects');
V.finance=()=>{const m=D().slice(0,7),ex=S.tx.filter(x=>x.type=='Expense'&&x.date.startsWith(m)),by={};ex.forEach(x=>by[x.category||'Other']=(by[x.category||'Other']||0)+x.amount);const mx=Math.max(1,...Object.values(by));
return gen('tx',`<div class=card style="margin:0 0 12px"><div class=big>${money(bal())}</div><span class=m>Recorded balance from manual entries. No bank accounts are connected.</span><h4 style="margin-top:12px">Spending this month</h4>${Object.entries(by).map(([k,v])=>`${esc(k)} <span class=m>${money(v)}</span>${bar(pct(v,mx))}`).join('')||none('No expenses recorded this month.')}</div>`)};
V.learning=()=>{const by={};S.study.forEach(s=>{const o=by[s.subject]=by[s.subject]||{m:0,w:0};o.m+=+s.minutes||0;if(s.level=='Needs work')o.w++});
return gen('study',`<div class=card style="margin-bottom:12px"><h4>Subjects</h4>${Object.entries(by).map(([k,v])=>`<div class=row><b class=g>${esc(k)}</b><span class=m>${(v.m/60).toFixed(1)}h · ${v.w} topics need work</span></div>`).join('')||none('Log a session to see subjects.')}<h4 style="margin-top:12px">Exams</h4>${S.events.filter(e=>e.type=='Exam'&&e.date>=D()).sort((a,b)=>a.date>b.date?1:-1).map(e=>`<div class=row><b class=g>${esc(e.title)}</b><span class=m>${Math.ceil((new Date(e.date)-new Date(D()))/864e5)} days</span></div>`).join('')||none('Add an event of type Exam for a countdown.')}</div>`)};
V.health=()=>{const l=S.health.filter(h=>h.date>add(D(),-7)),av=k=>l.length?(sum(l.map(x=>x[k]))/l.length).toFixed(1):'–';
return gen('health',`<div class=card style="margin-bottom:12px"><h4>7-day averages (self-reported, not medical)</h4>Sleep ${av('sleep')}h · Exercise ${av('exercise')} min · Water ${av('water')} · Energy ${av('energy')}/5 · Mood ${av('mood')}/5</div>`)};
